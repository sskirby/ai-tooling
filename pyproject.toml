[project]
name = "ai-tooling-evals"
version = "0.1.0"
description = "Replay eval tooling for this repo's Claude Code plugins."
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
replay-eval = "evals.wrapper:main"
replay-generate = "evals.generate:main"
replay-capture = "evals.capture:main"

[dependency-groups]
dev = ["mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# scripts/evals stays where it is; hatchling maps the directory to the top-level package "evals".
packages = ["scripts/evals"]
