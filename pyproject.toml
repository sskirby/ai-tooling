[project]
name = "ai-tooling-evals"
version = "0.1.0"
description = "Replay eval tooling for this repo's Claude Code plugins."
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
replay-eval = "evals.wrapper:main"
replay-generate = "evals.generate:main"
replay-capture = "evals.capture:main"

[dependency-groups]
dev = ["mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# scripts/evals stays where it is; hatchling maps the directory to the top-level package "evals".
packages = ["scripts/evals"]

[tool.mypy]
strict = true
files = ["scripts/evals", "test/evals"]
exclude = "^test/evals/fixtures/"

[[tool.mypy.overrides]]
module = ["test_capture", "test_generate", "test_pairing", "test_sources", "test_transcript", "test_wrapper", "helpers"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
