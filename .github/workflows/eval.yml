name: eval

# By hand only. A full run is dozens of child sessions on a live credential,
# forks get no secrets, and LLM graders are probabilistic — none of that
# belongs in a required check. See plugins/what-the-heck/README.md, decision B4.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model under test, as a full model ID (e.g. claude-opus-5-5)"
        required: true
      case:
        description: "Case name glob (blank runs all)"
        required: false
        default: ""
      max_cost_usd:
        description: "Hard cost ceiling in USD"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          CASE_GLOB: ${{ inputs.case }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          args=(./plugins/what-the-heck --model "$MODEL" --trust-plugin --no-publish --report eval-report.html)
          args+=(--max-cost-usd "$MAX_COST_USD" --json eval-result.json)
          if [ -n "$CASE_GLOB" ]; then args+=(--case "$CASE_GLOB"); fi
          uv run replay-eval "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval-report.html
            eval-result.json
            delta.md
