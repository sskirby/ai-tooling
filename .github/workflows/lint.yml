name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Linter unit tests
        run: uv run --with pyyaml python -m unittest discover -s test/lint -v
      - name: Lint manifests and eval cases
        run: uv run scripts/lint.py
      - name: Eval tooling unit tests
        run: uv run python -m unittest discover -s test/evals -v
      - name: Eval tooling types
        run: uv run mypy
      - name: Replay sources
        run: uv run replay-generate --check
