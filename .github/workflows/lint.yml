name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linter unit tests
        run: ruby test/lint_test.rb
      - name: Lint manifests and eval cases
        run: ruby scripts/lint.rb
