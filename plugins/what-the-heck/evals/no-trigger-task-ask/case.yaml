schema_version: "1.1"
name: no-trigger-task-ask
description: >
  A direct request for a task is answered directly. The teaching skill must not
  fire on it, and no lesson is offered.
tags: [trigger]
execution:
  prompt: |
    how do I add an index to this table?

        create table orders (
          id          bigserial primary key,
          company_id  bigint      not null,
          placed_at   timestamptz not null,
          status      text        not null
        );

    Queries filter on company_id and status, and sort by placed_at.
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill]
runs: 3
graders:
  - name: skill-did-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answers-directly-no-lesson
    type: llm
    focus: last_message
    criteria: |
      The reply's main content is the index itself — a CREATE INDEX statement,
      or the column list for one, with a sentence on why that column order.
      It does not offer to teach the topic, does not lay out a numbered route
      of steps, does not label anything "Step 1 of N", and does not end by
      asking the reader what prompted the question or how much they already
      know. A short clarifying question about the workload is acceptable only
      if the index is still given.
