schema_version: "1.1"
name: no-trigger-task-ask
description: >
  A direct request for a task is answered directly. The teaching skill must not
  fire on it, and no lesson is offered.
tags: [trigger]
execution:
  model: claude-opus-5-5
  prompt: |
    how do I add an index to this table?

        create table orders (
          id          bigserial primary key,
          company_id  bigint      not null,
          placed_at   timestamptz not null,
          status      text        not null
        );

    Queries filter on company_id and status, and sort by placed_at.
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill]
runs: 3
graders:
  - name: skill-did-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answers-directly-no-lesson
    type: llm
    focus: last_message
    criteria: |
      The reply's main content is the index itself — a CREATE INDEX statement,
      or the column list for one, with a short explanation of the column order.
      Ordinary technical prose is fine, including bullet lists of trade-offs and
      short headed sections; that is how a colleague answers this question.
      Fail only if the reply turns the question into a lesson, by doing any of:
      labelling content as a step of a lesson ("Step 1 of 4"); laying out a
      numbered route of topics it will teach before answering; asking the reader
      a calibration question (what prompted this, how much they already know)
      before giving the index; or ending by asking the reader a comprehension
      question about indexes. A clarifying question about the workload is fine as
      long as the index is still given.
