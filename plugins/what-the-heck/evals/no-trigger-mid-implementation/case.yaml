schema_version: "1.1"
name: no-trigger-mid-implementation
description: >
  A quick question about a name in code we are mid-way through writing is
  answered in place, not turned into a lesson.
tags: [trigger]
execution:
  prompt: |
    We're halfway through wiring retry logic into the HTTP client. Here's what
    we have so far:

        def fetch(url, attempts: 5, backoff_ms: 200)
          attempts.times do |i|
            response = get(url)
            return response if response.ok?
            sleep((backoff_ms * (2**i)) / 1000.0)
          end
          raise RetriesExhausted, url
        end

    quick one — what does backoff_ms do here?
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill]
runs: 3
graders:
  - name: skill-did-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: answers-in-place
    type: llm
    focus: last_message
    criteria: |
      The reply answers in place, in roughly a paragraph: backoff_ms is the base
      delay that doubles each attempt, so the waits are 200ms, 400ms, 800ms and
      so on. Ordinary prose is fine, and so is a short list of related
      observations about the code — that is a normal colleague answer to a
      question asked mid-task. Fail only if the reply turns the question into a
      lesson, by doing any of: labelling content as a step of a lesson ("Step N
      of M"); laying out a numbered route of topics it will teach; asking the
      reader a calibration question before answering; or ending by asking the
      reader a comprehension question.
