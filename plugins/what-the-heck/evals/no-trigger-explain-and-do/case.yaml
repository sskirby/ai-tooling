schema_version: "1.1"
name: no-trigger-explain-and-do
description: >
  A task request carrying an "I don't get this, explain as you go" rider.
  The trigger is narrow: the skill does not take over, the task gets done
  and explained in place.
tags: [trigger]
execution:
  model: claude-opus-5-5
  prompt: |
    I don't really get indexes — can you add one to this table and explain
    as you go?

        create table orders (
          id          bigserial primary key,
          company_id  bigint      not null,
          placed_at   timestamptz not null,
          status      text        not null
        );

    Queries filter on company_id and status, and sort by placed_at.
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Skill]
runs: 3
graders:
  - name: skill-did-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: explains-while-doing-the-task
    type: llm
    focus: last_message
    criteria: |
      The reply does the task and explains as it goes: it gives the index —
      a CREATE INDEX statement, or the column list for one — and explains
      the column order as part of answering. Bullet lists, short headed
      sections and a worked explanation are all fine and expected; the
      reader asked to be explained to, so explanation is not a failure.
      Fail only if the reply defers the task in favour of a lesson, by
      doing any of: laying out a numbered route of topics it will teach
      before giving the index; labelling content as a step of a lesson
      ("Step 1 of 4"); asking the reader a calibration question before
      giving the index; or ending by asking the reader a comprehension
      question instead of delivering the index.
