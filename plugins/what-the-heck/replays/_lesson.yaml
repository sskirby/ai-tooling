skill: what-the-heck:what-the-heck
model: claude-opus-5-5
messages:
- role: user
  content: what the heck is a CTE?
- role: assistant
  skill:
    name: what-the-heck:what-the-heck
    args: CTE
  content: |-
    A CTE is a named subquery you write at the top of a statement with `WITH`,
    so the rest of the query can refer to it by name. It exists only for that
    one statement.

    Here's the route:

    1. A CTE is a named subquery the rest of the statement can refer to by name
    2. Since Postgres 12 a plain CTE is normally inlined into the outer query
       rather than evaluated on its own first
    3. Because it is inlined, a filter written outside the CTE can be pushed
       down into it and run earlier
    4. MATERIALIZED, recursive and side-effecting CTEs are kept separate, and a
       filter cannot be pushed into those
    5. A CTE referenced more than once is materialised by default: its body runs
       once and the result is shared, but no outer filter can be pushed into it

    What prompted the question — did you run into a `WITH` in someone else's
    query, or are you trying to write one?
- role: user
  content: |-
    I'm about to start using CTEs in our reports, and a colleague warned me they can make queries slow. I haven't written one yet.
- role: assistant
  content: |-
    Your colleague's warning is the main thing to understand, and it's mostly out of date. Steps 2–5 cover exactly when it's still true. The route stays the same. One assumption: I'm treating this as **Postgres**, because the slowness story is different in each database. Tell me if your reports run on something else.

    ## Step 1 of 5 — A CTE is a named subquery the rest of the statement can refer to by name

    You write a query, give it a name with `WITH name AS (...)`, and then use that name in the main query as if it were a table. It works just like putting the same query inline in `FROM (...)`. The only difference is that it's pulled out to the top and given a readable name.

    The name exists only inside that one statement. It isn't a table, and it isn't saved anywhere. Once the statement's semicolon runs, the name no longer exists.

    ```sql
    WITH big_orders AS (                  -- 1. name a query
      SELECT customer_id, total
      FROM orders
      WHERE total > 1000
    )
    SELECT c.name, b.total                -- 2. use it like a table
    FROM big_orders b
    JOIN customers c ON c.id = b.customer_id;
    ```

    ```
      same thing, written inline:

      SELECT c.name, b.total
      FROM ( SELECT customer_id, total          <── big_orders
             FROM orders WHERE total > 1000 ) b
      JOIN customers c ON c.id = b.customer_id;
    ```

    **Check:** Say your report script runs the query above, and then runs this as a separate statement right after it:

    ```sql
    SELECT count(*) FROM big_orders;
    ```

    What happens, and why?

    (answer it, ask me anything, or say "next" to skip ahead)
- role: user
  content: It fails with relation "big_orders" does not exist. The name only lives inside the statement
    that defines it, so the next statement has no table or CTE by that name.
- role: assistant
  content: |-
    Right. The name exists only inside the statement that defines it, so the next statement can't see it.

    ## Step 2 of 5 — Postgres 12 stopped running the CTE first

    Before 12, a CTE was an optimization fence. The planner ran it on its own,
    stashed the rows, and only then let the rest of the statement touch them.
    Since 12 a plain CTE — not `MATERIALIZED`, not recursive, not
    side-effecting, referenced once — is inlined instead: the planner folds the
    CTE's body into the outer query and plans the whole statement as one unit.

    ```
      PG 11                        PG 12+
      ─────                        ──────
      run the CTE → stash rows     one query tree
      then run the outer query     one plan, decided together
    ```

    **Check:** Given that, what happens to a filter written outside the CTE, on
    a column the CTE selects?

    (answer it, ask me anything, or say "next" to skip ahead)
- role: user
  content: It gets pushed down into the CTE's scan and runs earlier, because the planner sees one query
    tree.
- role: assistant
  content: |-
    Right, and that is the whole idea of step 3, so this step shows it happening in a real plan.

    ## Step 3 of 5 — Because it is inlined, a filter written outside the CTE can be pushed down into it and run earlier

    Filter the step 1 CTE from outside. After inlining, the planner treats `customer_id = 7` as if you had written it inside the CTE. It moves the filter down to the scan of `orders`, so rows for other customers are never read. With an index on `orders.customer_id`, Postgres goes straight to customer 7's rows.

    ```sql
    WITH big_orders AS (
      SELECT customer_id, total FROM orders WHERE total > 1000
    )
    SELECT * FROM big_orders WHERE customer_id = 7;
    ```

    ```
      EXPLAIN on Postgres 12+

      Index Scan using orders_customer_id_idx on orders
        Index Cond: (customer_id = 7)    <── outer filter, pushed down
        Filter: (total > 1000)           <── the CTE's own filter
    ```

    There is no `CTE Scan` node: the CTE has disappeared into the scan of `orders`.

    **Check:** Say 50,000 orders have `total > 1000`, and customer 7 has 3 of them. Roughly how many rows does this plan read from `orders`, and how many would Postgres 11 have stashed before applying `customer_id = 7`?

    (answer it, ask me anything, or say "next" to skip ahead)
- role: user
  content: This plan reads only customer 7's orders through the index, a handful of rows. Postgres 11
    would have run the CTE first and stashed all 50,000 big orders, then thrown away all but 3.
- role: assistant
  content: |-
    Right. The index takes Postgres straight to customer 7's 3 rows. Postgres 11 would have stashed all 50,000 rows and then thrown away 49,997 of them.

    ## Step 4 of 5 — MATERIALIZED, recursive and side-effecting CTEs are kept separate, and a filter cannot be pushed into those

    Postgres won't inline a CTE when doing so could change the result or the work it does. It keeps the CTE separate in these cases:

    - **`AS MATERIALIZED`**: you asked it to.
    - **`WITH RECURSIVE`**: the CTE refers to itself, so there's nothing to fold into the outer query.
    - **Side effects**: the CTE contains `INSERT`/`UPDATE`/`DELETE ... RETURNING`, or calls a volatile function like `random()`.

    When it's kept separate, the old Postgres 11 behaviour comes back. The whole body runs first, and your outer filter is only applied afterwards.

    ```sql
    WITH big_orders AS MATERIALIZED (
      SELECT customer_id, total FROM orders WHERE total > 1000
    )
    SELECT * FROM big_orders WHERE customer_id = 7;
    ```

    ```
      CTE Scan on big_orders
        Filter: (customer_id = 7)      <── runs last, on stashed rows
        CTE big_orders
          ->  Seq Scan on orders
                Filter: (total > 1000) <── builds all 50,000 rows
    ```

    **Check:** Take this one:

    ```sql
    WITH gone AS (
      DELETE FROM orders WHERE total > 1000 RETURNING *
    )
    SELECT * FROM gone WHERE customer_id = 7;
    ```

    The output rows would look the same if Postgres pushed `customer_id = 7` into the `DELETE`. Why does it refuse to?

    (answer it, ask me anything, or say "next" to skip ahead)
- role: user
  content: Because the DELETE has to remove all 50,000 big orders whatever the outer query asks for. Pushing
    the filter in would delete only customer 7's rows, so the side effect would change even though the
    output looks the same.
- role: assistant
  content: |-
    Right. A data-modifying CTE always runs to completion, whatever the outer query does with its rows. That holds even if the outer query reads none of them.

    ## Step 5 of 5 — A CTE referenced more than once is materialised by default

    If you name the CTE twice in the outer query, Postgres assumes it should compute the rows once and share them. It doesn't copy the body into both places. So it materialises the CTE, just like `AS MATERIALIZED`, and a filter from either reference can't be pushed in.

    This comes up a lot in reports, because a CTE is often joined to itself or compared against another slice of itself. If sharing costs more than recomputing, write `AS NOT MATERIALIZED` to make Postgres inline the CTE at each reference.

    ```sql
    WITH big_orders AS (
      SELECT customer_id, total FROM orders WHERE total > 1000
    )
    SELECT a.total, b.total
    FROM big_orders a                -- reference 1
    JOIN big_orders b                -- reference 2
      ON b.customer_id = a.customer_id
    WHERE a.customer_id = 7;
    ```

    ```
      Hash Join
        ->  CTE Scan on big_orders a
              Filter: (customer_id = 7)   <── applied after the fact
        ->  CTE Scan on big_orders b
        CTE big_orders
          ->  Seq Scan on orders          <── all 50,000 built once
                Filter: (total > 1000)
    ```

    **Check:** Say a CTE wraps an expensive aggregate, such as every customer's monthly totals over all of `orders`, and two later branches of your report both read it. What does referencing it twice mean for that aggregate, and for each branch's filter?

    (answer it, ask me anything, or say "next" to skip ahead)
